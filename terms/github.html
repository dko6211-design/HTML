<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub - 웹 용어 정리집</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <main class="wrap detail">
    <a class="back" href="../index.html">← 목록으로 돌아가기</a>
    <h1>GitHub</h1>
    <span class="tag">개발</span>
    <div class="detail-card">Git을 기반으로 소스 코드를 저장하고 협업할 수 있는 온라인 플랫폼입니다. 리포지터리 관리, 코드 변경 이력 확인, 이슈 관리, 풀 리퀘스트 등의 기능을 제공합니다.</div>
    <section class="related-terms">
      <h2>GitHub 관련 용어</h2>
      <div id="related-list" class="related-grid"></div>
    </section>
  </main>
  <script>
    // 관련 용어를 추가할 때 이 배열에 항목만 추가하면 됩니다.
    const relatedTerms = [
      { name: 'Commit', url: './commit.html', description: '변경된 파일을 하나의 작업 단위로 기록하는 Git 작업입니다.' },
      { name: 'Push', url: './push.html', description: '로컬 저장소의 커밋을 원격 저장소에 업로드하는 작업입니다.' },
      { name: 'Fetch', url: './fetch.html', description: '원격 저장소의 변경 내용을 가져오되 현재 작업 브랜치에는 반영하지 않는 작업입니다.' },
      { name: 'Pull', url: './pull.html', description: '원격 저장소의 변경 내용을 가져와 현재 브랜치에 반영하는 작업입니다.' },
      { name: 'Pull Request', url: './pull-request.html', description: '내 브랜치의 변경 사항을 다른 브랜치에 반영해 달라고 요청하는 협업 기능입니다.' },
      { name: 'Merge', url: './merge.html', description: '서로 다른 브랜치의 변경 내용을 하나로 합치는 작업입니다.' }
    ];
    document.querySelector('#related-list').innerHTML = relatedTerms.map(term => `
      <a class="related-term" href="${term.url}">
        <h3>${term.name}</h3>
        <p>${term.description}</p>
        <span>자세히 보기 →</span>
      </a>`).join('');
  </script>
</body>
</html>
